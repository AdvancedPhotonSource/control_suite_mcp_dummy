worker:
  output_dir: .tmp/control_suite_mcp_dummy

mcp:
  include_images: true

acquisition:
  # Optional .npy, .tif, or .tiff image path. When null, the 512x512 cameraman image is used.
  image: null
  add_axis_ticks: true
  add_grid_lines: false
  invert_yaxis: false
  add_line_scan_candidates_to_image: false
  plot_image_in_log_scale: false
  poisson_noise_scale: 100
  scan_jitter: 0
  gaussian_psf_sigma: 1

parameter_setting:
  parameter_names:
    - z
  true_parameters:
    - 3.0
  parameter_ranges:
    - [0.0]
    - [10.0]
  drift_factor: 30
  blur_factor: 5
